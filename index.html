<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHC Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="card">
    <h1>GHC Hub</h1>
    <p>Green Hedge Capital · internal systems</p>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Password</label><input id="password" type="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" style="width:100%">Sign in</button>
  </div>
</div>

<!-- HOME -->
<div id="app" class="hidden">
  <header><div class="bar"></div></header>
  <main class="home">
    <h1 id="hello">Welcome</h1>
    <p class="sub">Choose a module</p>
    <div class="tiles" id="tiles"></div>

    <div id="adminArea" class="hidden" style="margin-top:36px">
      <div class="tabs"><button class="on" data-t="access">Module access</button><button data-t="users">Users</button></div>

      <div id="tab-access">
        <p class="sub">Tick to give access. <b>edit</b> = can add/change · <b>view</b> = read only. Managers and admins have all modules automatically.</p>
        <div class="tablewrap"><table class="grid-acc" id="accGrid"></table></div>
      </div>

      <div id="tab-users" class="hidden">
        <div class="tablewrap" style="margin-bottom:14px"><table style="font-size:13px"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody id="usersRows"></tbody></table></div>
        <h3 style="font-size:14px;margin:0 0 4px">Add user</h3>
        <div class="grid2" style="max-width:560px">
          <div><label>Full name</label><input id="nuName"></div>
          <div><label>Email</label><input id="nuEmail" type="email"></div>
          <div><label>Role</label><select id="nuRole"><option value="rm">User</option><option value="manager">Manager</option></select></div>
          <div><label>Starting password</label><input id="nuPass" placeholder="min 6 characters"></div>
        </div>
        <div class="err" id="nuErr"></div>
        <button class="btn" id="nuAdd">Add user</button>
      </div>
    </div>

    <div style="margin-top:30px"><button class="btn ghost small" id="pwBtn">Change my password</button></div>
  </main>
</div>

<script>
const MODULES = [
  { key: "touch",     name: "Touch & Review System", desc: "Client touches, written reviews, quarterly dashboards", href: "touch.html" },
  { key: "insurance", name: "Insurance",             desc: "Policies, renewals, documents, due-date tracking",     href: "insurance.html" },
];
let ctx = null, userModules = [];

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("loginBtn").disabled = false;
  if (error) $("loginErr").textContent = "Wrong email or password."; else boot();
};
$("password").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $("login").classList.remove("hidden"); $("app").classList.add("hidden"); return; }
  ctx = await requireAuth(null); if (!ctx) return;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  shellHeader("Home", ctx);
  $("hello").textContent = `Welcome, ${ctx.profile.full_name.split(" ")[0]}`;
  $("tiles").innerHTML = MODULES.map(m => {
    const has = ctx.isMgr || ctx.access[m.key];
    return `<a class="tile ${has ? "" : "locked"}" href="${m.href}"><b>${esc(m.name)}</b><span>${esc(m.desc)}</span>${has ? "" : `<span style="display:block;margin-top:6px;color:var(--warn)">No access</span>`}</a>`;
  }).join("");
  if (ctx.isMgr){
    $("adminArea").classList.remove("hidden");
    try { userModules = await fetchAll("user_modules", "user_id, module, level"); } catch (e){ userModules = []; }
    renderAccess(); renderUsers();
  }
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("tab-access").classList.toggle("hidden", b.dataset.t !== "access"); $("tab-users").classList.toggle("hidden", b.dataset.t !== "users");
});

/* ---- access grid ---- */
function renderAccess(){
  const users = ctx.profiles.slice().sort((a,b) => a.full_name.localeCompare(b.full_name));
  $("accGrid").innerHTML = `<thead><tr><th>User</th><th>Role</th>${MODULES.map(m => `<th>${esc(m.name)}</th>`).join("")}</tr></thead><tbody>` +
    users.map(u => `<tr><td>${esc(u.full_name)}<div style="font-size:11px;color:var(--muted)">${esc(u.email || "")}</div></td><td>${u.role === "rm" ? "user" : u.role}</td>` +
      MODULES.map(m => {
        if (u.role !== "rm") return `<td style="color:var(--muted)">all</td>`;
        const cur = (userModules.find(x => x.user_id === u.id && x.module === m.key) || {}).level || "";
        return `<td><select data-u="${u.id}" data-m="${m.key}"><option value="">— none —</option><option value="view" ${cur==="view"?"selected":""}>view</option><option value="edit" ${cur==="edit"?"selected":""}>edit</option></select></td>`;
      }).join("") + "</tr>").join("") + "</tbody>";
  document.querySelectorAll("#accGrid select").forEach(s => s.onchange = async () => {
    const { u, m } = s.dataset, level = s.value;
    let r;
    if (!level) r = await sb.from("user_modules").delete().eq("user_id", u).eq("module", m);
    else r = await sb.from("user_modules").upsert({ user_id: u, module: m, level }, { onConflict: "user_id,module" });
    if (r.error){ alert("Could not save: " + r.error.message); return; }
    userModules = userModules.filter(x => !(x.user_id === u && x.module === m)); if (level) userModules.push({ user_id: u, module: m, level });
    toast("Access updated ✓");
  });
}

/* ---- users ---- */
async function adminCall(body){
  const { data, error } = await sb.functions.invoke("admin-users", { body });
  if (error) throw new Error(error.message || "function error");
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function reloadProfiles(){ ctx.profiles = await fetchAll("profiles", "id, full_name, role, email"); renderUsers(); renderAccess(); }
function renderUsers(){
  $("usersRows").innerHTML = ctx.profiles.slice().sort((a,b) => a.full_name.localeCompare(b.full_name)).map(p => `<tr>
    <td>${esc(p.full_name)}</td><td>${esc(p.email || "")}</td><td>${({ admin: "Super admin", manager: "Manager", rm: "User" })[p.role] || p.role}</td>
    <td style="white-space:nowrap">${ctx.isSuper ? `<button class="btn ghost small" data-u="pw" data-id="${p.id}">Reset password</button>
    <button class="btn ghost small" data-u="edit" data-id="${p.id}">Edit</button>
    ${p.id === ctx.me.id ? "" : `<button class="btn ghost small" data-u="del" data-id="${p.id}" style="color:var(--warn);border-color:var(--warn)">Remove</button>`}` : ""}</td></tr>`).join("");
  document.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => {
    const p = ctx.profiles.find(x => x.id === b.dataset.id); if (!p) return;
    try {
      if (b.dataset.u === "pw"){ const np = prompt(`New password for ${p.full_name} (min 6):`); if (!np) return; if (np.length < 6){ toast("Too short"); return; }
        await adminCall({ action: "password", id: p.id, password: np }); toast(`Password set ✓`); }
      if (b.dataset.u === "edit"){ const name = prompt("Full name:", p.full_name); if (name === null) return;
        const role = prompt("Role — rm (user) or manager:", p.role); if (role === null) return;
        if (!["rm","manager","admin"].includes(role)){ toast("Role must be rm or manager"); return; }
        await adminCall({ action: "update", id: p.id, full_name: name.trim(), role }); await reloadProfiles(); toast("Updated ✓"); }
      if (b.dataset.u === "del"){ if (!confirm(`Remove ${p.full_name}? Their clients become unassigned; their notes are kept.`)) return;
        await adminCall({ action: "delete", id: p.id }); await reloadProfiles(); toast("User removed"); }
    } catch (e){ alert("Failed: " + e.message + "\n\nIf the function is missing, deploy admin-users in Supabase → Edge Functions."); }
  });
}
$("nuAdd").onclick = async () => {
  $("nuErr").textContent = "";
  const full_name = $("nuName").value.trim(), email = $("nuEmail").value.trim().toLowerCase(), role = $("nuRole").value, password = $("nuPass").value;
  if (!full_name || !email || password.length < 6){ $("nuErr").textContent = "Name, email and a 6+ character password are required."; return; }
  $("nuAdd").disabled = true;
  try { await adminCall({ action: "create", full_name, email, role, password }); await reloadProfiles(); $("nuName").value = $("nuEmail").value = $("nuPass").value = ""; toast(`${full_name} added ✓ — now tick their modules above`); }
  catch (e){ $("nuErr").textContent = e.message; }
  $("nuAdd").disabled = false;
};
$("pwBtn").onclick = async () => {
  const p1 = prompt("New password (min 6 characters):"); if (p1 === null) return;
  if (p1.length < 6){ toast("Too short"); return; }
  const p2 = prompt("Type it again:"); if (p2 !== p1){ toast("Passwords don't match"); return; }
  const { error } = await sb.auth.updateUser({ password: p1 }); toast(error ? "Could not change: " + error.message : "Password changed ✓", 4000);
};
boot();
</script>
</body>
</html>
